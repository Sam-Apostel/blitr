name: macOS

# The native macOS build (issue #19): build, the regression set, the three suites, and the release tarball.
# Started by hand only: the repository is private and macOS runner minutes count 10x against the quota.
on:
  workflow_dispatch:
    inputs:
      swift-version:
        description: Swift toolchain to install with swiftly (empty uses the runner's Xcode toolchain)
        required: false
        default: ""

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: Build, render and test on macOS
    runs-on: macos-latest
    env:
      SWIFTUI_SCREENSHOT_CACHE: ${{ github.workspace }}/.cache/swiftui-screenshot
    steps:
      - uses: actions/checkout@v4

      - name: Install HarfBuzz and pkg-config
        run: brew install harfbuzz pkg-config

      - name: Install the Swift toolchain
        if: inputs.swift-version != ''
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          swiftly install --use "${{ inputs.swift-version }}"
          echo "${SWIFTLY_BIN_DIR:-$HOME/.swiftly/bin}" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          swift --version
          xcrun --show-sdk-path

      - name: Fetch pinned Skia and fonts
        run: scripts/bootstrap.sh

      - name: Build
        run: swift build 2>&1 | tee build.log

      - name: Apple's SwiftUI must not be linked
        run: |
          bin="$(swift build --show-bin-path)"
          otool -L "$bin/libSwiftUIScreenshotEngine.dylib" | tee otool-engine.txt
          if grep -q 'SwiftUI.framework' otool-engine.txt; then echo "the engine links Apple's SwiftUI" >&2; exit 1; fi

      - name: Render the regression set
        run: REGRESSION_STRICT=1 scripts/regression.sh out/macos --jobs 3

      - name: Compiled previews must not link Apple's SwiftUI
        run: |
          runner="$(find "$SWIFTUI_SCREENSHOT_CACHE" -name runner -type f | head -1)"
          otool -L "$runner" | tee otool-runner.txt
          if grep -qE 'SwiftUI|UIKit|AppKit' otool-runner.txt; then echo "a compiled preview links an Apple UI framework" >&2; exit 1; fi

      - name: Project mode
        run: Tests/Projects/run.sh out/Projects

      - name: Framework shims
        run: Tests/Frameworks/run.sh out/Frameworks

      - name: Interaction capture
        run: Tests/Interaction/run.sh out/Interaction

      - name: Release tarball
        run: scripts/make-dist.sh

      - name: Upload renders and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            out/macos/**/*.png
            dist/*.tar.gz
            build.log
            render.log
            otool-*.txt
          if-no-files-found: warn
