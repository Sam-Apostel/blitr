name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    name: Build and render examples
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libharfbuzz-dev curl unzip binutils ca-certificates python3

      - name: Fetch pinned Skia and fonts
        run: scripts/bootstrap.sh

      - name: Build
        run: swift build

      - name: Render every example and the acceptance corpus
        run: |
          bin="$(swift build --show-bin-path)"
          "$bin/swiftui-screenshot" doctor
          # Every file must compile against the module and render; a failure here is a regression.
          find Examples Tests/Corpus -name '*.swift' | sort | while read -r file; do
            echo "::group::$file"
            # tvOS screens render on the Apple TV profile (which also compiles their #if os(tvOS) branches).
            device=""
            case "$file" in *TV*.swift) device="--device apple-tv" ;; esac
            "$bin/swiftui-screenshot" render "$file" --all --out-dir "out/$(dirname "$file")" --scheme both $device
            echo "::endgroup::"
          done

      - name: Project mode (XcodeGen, Xcode project and Swift package fixture)
        run: Tests/Projects/run.sh out/Projects

      - name: Framework shims (known-answer checks)
        run: Tests/Frameworks/run.sh out/Frameworks

      - name: Interaction capture (frame counts, determinism)
        run: Tests/Interaction/run.sh out/Interaction

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/**/*.png
          if-no-files-found: error
